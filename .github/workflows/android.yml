    // ---------------------------------------------------------
    // SEARCH INSTALLED APP
    // ---------------------------------------------------------

    private boolean tryOpenAppByName(
            String query
    ) {

        try {

            PackageManager pm =
                    getPackageManager();

            List<ApplicationInfo> apps =
                    pm.getInstalledApplications(
                            PackageManager.GET_META_DATA
                    );

            for (ApplicationInfo app : apps) {

                Intent launch =
                        pm.getLaunchIntentForPackage(
                                app.packageName
                        );

                if (launch == null) continue;

                String label =
                        pm.getApplicationLabel(app)
                                .toString()
                                .toLowerCase(
                                        Locale.ROOT
                                );

                if (label.equals(query) ||
                        label.contains(query)) {

                    launch.addFlags(
                            Intent.FLAG_ACTIVITY_NEW_TASK
                    );

                    startActivity(launch);

                    return true;
                }
            }

        } catch (Exception e) {

            return false;
        }

        return false;
    }

    // ---------------------------------------------------------
    // ALL APPS
    // ---------------------------------------------------------

    private void showInstalledApps() {

        try {

            PackageManager pm =
                    getPackageManager();

            List<ApplicationInfo> apps =
                    pm.getInstalledApplications(
                            PackageManager.GET_META_DATA
                    );

            final ArrayList<ApplicationInfo> launchable =
                    new ArrayList<>();

            for (ApplicationInfo app : apps) {

                Intent launch =
                        pm.getLaunchIntentForPackage(
                                app.packageName
                        );

                if (launch != null) {

                    launchable.add(app);
                }
            }

            Collections.sort(
                    launchable,
                    new Comparator<ApplicationInfo>() {

                        @Override
                        public int compare(
                                ApplicationInfo a,
                                ApplicationInfo b
                        ) {

                            String aa =
                                    pm.getApplicationLabel(a)
                                            .toString();

                            String bb =
                                    pm.getApplicationLabel(b)
                                            .toString();

                            return aa.compareToIgnoreCase(bb);
                        }
                    }
            );

            final String[] names =
                    new String[launchable.size()];

            for (int i = 0;
                 i < launchable.size();
                 i++) {

                names[i] =
                        pm.getApplicationLabel(
                                launchable.get(i)
                        ).toString();
            }

            new AlertDialog.Builder(this)
                    .setTitle(
                            "♡ Boss, Installed Apps ♡"
                    )
                    .setItems(
                            names,
                            (dialog, which) -> {

                                try {

                                    Intent launch =
                                            pm.getLaunchIntentForPackage(
                                                    launchable
                                                            .get(which)
                                                            .packageName
                                            );

                                    if (launch != null) {

                                        startActivity(
                                                launch
                                        );
                                    }

                                } catch (Exception ignored) {
                                }
                            }
                    )
                    .setNegativeButton(
                            "Close",
                            null
                    )
                    .show();

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "Boss, apps list nahi mil paayi.",
                    Toast.LENGTH_SHORT
            ).show();
        }
    }

    // ---------------------------------------------------------
    // STATE + 3D STYLE ANIMATION
    // ---------------------------------------------------------

    private void setState(String state) {

        if (stateText == null) return;

        if (state.equals("listening")) {

            stateText.setText(
                    "● Listening... 🎙\nBoss, boliye..."
            );

            stateText.setTextColor(
                    Color.rgb(70, 180, 255)
            );

            animateListening();

        } else if (state.equals("thinking")) {

            stateText.setText(
                    "● Thinking... 💭"
            );

            stateText.setTextColor(
                    Color.rgb(255, 100, 240)
            );

            animateThinking();

        } else if (state.equals("speaking")) {

            stateText.setText(
                    "● Speaking... ♡"
            );

            stateText.setTextColor(
                    Color.rgb(190, 90, 255)
            );

            animateSpeaking();

        } else {

            stateText.setText(
                    "● Idle  ♡ Always With You"
            );

            stateText.setTextColor(
                    Color.WHITE
            );

            startIdle3DAnimation();
        }
    }

    private void startIdle3DAnimation() {

        if (alina == null) return;

        alina.animate().cancel();

        alina.setCameraDistance(
                12000 *
                        getResources()
                                .getDisplayMetrics()
                                .density
        );

        alina.animate()
                .scaleX(1.03f)
                .scaleY(1.03f)
                .rotationY(2f)
                .setDuration(1400)
                .withEndAction(() -> {

                    if (alina == null) return;

                    alina.animate()
                            .scaleX(1.0f)
                            .scaleY(1.0f)
                            .rotationY(-2f)
                            .setDuration(1400)
                            .withEndAction(
                                    this::startIdle3DAnimation
                            )
                            .start();
                })
                .start();
    }

    private void animateListening() {

        if (alina == null) return;

        alina.animate()
                .scaleX(1.06f)
                .scaleY(1.06f)
                .rotationY(5f)
                .setDuration(350)
                .start();

        blinkMic();
    }

    private void animateThinking() {

        if (alina == null) return;

        alina.animate()
                .rotationY(8f)
                .scaleX(1.04f)
                .scaleY(1.04f)
                .setDuration(500)
                .start();
    }

    private void animateSpeaking() {

        if (alina == null) return;

        alina.animate()
                .scaleX(1.07f)
                .scaleY(1.07f)
                .rotationY(-5f)
                .setDuration(300)
                .withEndAction(() -> {

                    if (alina != null) {

                        alina.animate()
                                .scaleX(1.02f)
                                .scaleY(1.02f)
                                .rotationY(5f)
                                .setDuration(300)
                                .start();
                    }
                })
                .start();
    }

    private void blinkMic() {

        if (micText == null) return;

        AlphaAnimation blink =
                new AlphaAnimation(
                        1.0f,
                        0.35f
                );

        blink.setDuration(250);
        blink.setRepeatMode(
                AlphaAnimation.REVERSE
        );
        blink.setRepeatCount(3);

        micText.startAnimation(blink);
    }

    // ---------------------------------------------------------
    // MICROPHONE PERMISSION
    // ---------------------------------------------------------

    private void requestAudioPermission() {

        if (android.os.Build.VERSION.SDK_INT >= 23) {

            if (checkSelfPermission(
                    Manifest.permission.RECORD_AUDIO
            ) != PackageManager.PERMISSION_GRANTED) {

                requestPermissions(
                        new String[]{
                                Manifest.permission.RECORD_AUDIO
                        },
                        100
                );
            }
        }
    }

    // ---------------------------------------------------------
    // DESTROY
    // ---------------------------------------------------------

    @Override
    protected void onDestroy() {

        if (speechRecognizer != null) {

            speechRecognizer.destroy();
        }

        if (tts != null) {

            tts.stop();
            tts.shutdown();
        }

        handler.removeCallbacksAndMessages(null);

        super.onDestroy();
    }
}
