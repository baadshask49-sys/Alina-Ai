    // ---------------------------------------------------------
    // OPEN APP
    // ---------------------------------------------------------

    private void open(
            String packageName,
            String fallback
    ) {

        try {

            Intent launch =
                    getPackageManager()
                            .getLaunchIntentForPackage(
                                    packageName
                            );

            if (launch != null) {

                startActivity(launch);

            } else {

                openWeb(fallback);
            }

        } catch (Exception e) {

            openWeb(fallback);
        }
    }

    private void openWeb(String url) {

        try {

            Intent i =
                    new Intent(
                            Intent.ACTION_VIEW
                    );

            i.setData(
                    android.net.Uri.parse(url)
            );

            startActivity(i);

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "Boss, ye open nahi ho paaya.",
                    Toast.LENGTH_SHORT
            ).show();
        }
    }

